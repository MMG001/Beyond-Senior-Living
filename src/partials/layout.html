<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{pageTitle}}</title>
<meta name="description" content="{{pageDescription}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#16263f">
<meta name="format-detection" content="telephone=no">
<meta name="geo.region" content="US-MN">
<meta name="geo.placename" content="Woodbury, Minnesota">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Beyond Senior Living">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{ogTitle}}">
<meta property="og:description" content="{{pageDescription}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Beyond Senior Living, assisted living in Woodbury, MN">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ogTitle}}">
<meta name="twitter:description" content="{{pageDescription}}">
<meta name="twitter:image" content="{{ogImage}}">

<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<link rel="preload" href="/assets/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/source-serif-4.woff2" as="font" type="font/woff2" crossorigin>
{{preload}}
<link rel="stylesheet" href="/assets/css/site.css?v={{cssV}}">
<script src="/assets/js/site.js?v={{jsV}}" defer></script>
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body class="{{bodyClass}}">
<x-partial name="header" />
<main id="main" tabindex="-1">
{{content}}
</main>
<x-partial name="footer" />
</body>
</html>
